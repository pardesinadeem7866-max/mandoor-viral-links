<script>
const SUPABASE_URL = "https://vnneunihydltvsyxheeg.supabase.co";
const SUPABASE_KEY = "sb_publishable_bZMBGeoDYDLI9zTYz4yqLw_Pwfa02DY";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allApprovedGroups = [];
let currentCategory = 'All';

// Fetch Live Site Settings from Supabase
async function fetchSiteSettings() {
    try {
        const { data, error } = await db.from('settings').select('*').limit(1).single();
        if (error || !data) return;

        if (data.website_title) {
            document.title = data.website_title;
            const siteTitleElem = document.getElementById('siteTitle');
            if (siteTitleElem) siteTitleElem.innerText = data.website_title;
        }

        if (data.main_heading || data.main_subtext) {
            const heroElem = document.getElementById('heroSection');
            if (data.main_heading) document.getElementById('mainHeading').innerText = data.main_heading;
            if (data.main_subtext) document.getElementById('mainSubtext').innerText = data.main_subtext;
            heroElem.classList.remove('hidden');
        }

        const bannerElem = document.getElementById('announcementBanner');
        const bannerTextElem = document.getElementById('announcementText');
        if (data.announcement_status === 'ON' && data.announcement_text) {
            bannerTextElem.innerText = data.announcement_text;
            bannerElem.classList.remove('hidden');
        } else {
            bannerElem.classList.add('hidden');
        }
    } catch (e) {
        console.log("Settings Fetch Error:", e);
    }
}

// Share Website Function
async function shareWebsite() {
    if (navigator.share) {
        try {
            await navigator.share({
                title: document.title,
                text: 'Join latest WhatsApp & Telegram groups!',
                url: window.location.href
            });
        } catch (err) {
            console.log('Share canceled:', err);
        }
    } else {
        try {
            await navigator.clipboard.writeText(window.location.href);
            alert('Website link copied to clipboard!');
        } catch (err) {
            alert('Link copy karne ke liye URL copy karein: ' + window.location.href);
        }
    }
}

async function trackVisitor() {
    try {
        await db.from('visitors').insert([{}]);
    } catch(e){}
}
trackVisitor();

async function fetchGroups() {
    const { data, error } = await db.from('groups').select('*');
    if (error || !data) {
        document.getElementById('listingsGrid').innerHTML = '<p class="text-center text-xs text-red-400 py-8">Error loading groups.</p>';
        return;
    }
    allApprovedGroups = data;
    renderGroups();
}

function renderGroups() {
    const grid = document.getElementById('listingsGrid');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');

    const search = searchInput ? searchInput.value.toLowerCase() : '';
    const sortBy = sortSelect ? sortSelect.value : 'latest';

    // Search and Category Filter
    let filtered = allApprovedGroups.filter(g => {
        const matchCategory = currentCategory === 'All' || g.category === currentCategory;
        const matchSearch = g.name.toLowerCase().includes(search);
        return matchCategory && matchSearch;
    });

    // Sorting Logic (VIP Pinned groups automatically stay at the top)
    filtered.sort((a, b) => {
        if (a.is_pinned !== b.is_pinned) {
            return b.is_pinned ? 1 : -1;
        }

        if (sortBy === 'popular') {
            return (b.clicks || 0) - (a.clicks || 0);
        } else {
            // Latest First
            return new Date(b.created_at || 0) - new Date(a.created_at || 0);
        }
    });

    const countElem = document.getElementById('groupCount');
    if (countElem) countElem.innerText = filtered.length;

    if (filtered.length === 0) {
        grid.innerHTML = '<p class="text-center text-xs text-gray-500 col-span-2 py-8">No groups found in this category.</p>';
        return;
    }

    const defaultImg = "https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg";

    grid.innerHTML = filtered.map(item => {
        const imgUrl = item.image_url ? item.image_url : defaultImg;

        // Date Formatting
        let formattedDate = "N/A";
        if (item.created_at) {
            const dateObj = new Date(item.created_at);
            formattedDate = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        return `
        <div class="bg-slate-900 border ${item.is_pinned ? 'border-amber-500/50 bg-amber-500/5 shadow-amber-500/10' : 'border-slate-800'} rounded-2xl p-5 flex flex-col justify-between gap-4 shadow-xl relative">
            <div>
                <div class="flex items-center justify-between gap-2 mb-3">
                    <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md font-medium">${item.platform} • ${item.category}</span>
                    ${item.is_pinned ? '<span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-md font-bold">📌 VIP PINNED</span>' : ''}
                </div>

                <div class="flex items-start gap-3 mb-2">
                    <img src="${imgUrl}" onerror="this.onerror=null; this.src='${defaultImg}';" class="w-12 h-12 rounded-full object-cover border border-slate-700 shrink-0 bg-slate-950 p-0.5 mt-0.5" alt="Group DP">
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-white text-base leading-snug line-clamp-2">${item.name}</h3>
                        ${item.description ? `<p class="text-xs text-slate-400 mt-1 line-clamp-2 leading-relaxed">${item.description}</p>` : ''}
                        
                        <!-- Joins Count & Added Date -->
                        <div class="flex flex-wrap items-center gap-2 mt-2">
                            <div class="inline-flex items-center gap-1.5 text-[11px] text-slate-300 bg-slate-950 border border-slate-800 px-2 py-0.5 rounded-lg">
                                <i class="fa-solid fa-eye text-emerald-400"></i>
                                <span><b>${item.clicks || 0}</b> Joins</span>
                            </div>
                            <div class="inline-flex items-center gap-1.5 text-[11px] text-slate-400 bg-slate-950 border border-slate-800 px-2 py-0.5 rounded-lg">
                                <i class="fa-regular fa-calendar-days text-slate-400"></i>
                                <span>${formattedDate}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <a href="${item.link}" target="_blank" onclick="trackClick('${item.id}')" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-base py-3.5 rounded-xl text-center flex items-center justify-center gap-2 transition-all shadow-lg shadow-emerald-500/20">
                <i class="fa-brands fa-whatsapp text-xl"></i> Join Group
            </a>
        </div>
        `;
    }).join('');
}

async function trackClick(id) {
    try {
        const item = allApprovedGroups.find(g => g.id == id);
        if (item) {
            const newClicks = (parseInt(item.clicks) || 0) + 1;
            item.clicks = newClicks;
            
            renderGroups();
            
            const { error } = await db.from('groups').update({ clicks: newClicks }).eq('id', id);
            if (error) {
                console.error("Supabase Update Error:", error.message);
            }
        }
    } catch(e) {
        console.error("Click Tracking Error:", e);
    }
}

function selectCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => {
        b.classList.remove('bg-emerald-500', 'text-white', 'active');
        b.classList.add('bg-slate-950', 'text-gray-400');
    });
    btn.classList.remove('bg-slate-950', 'text-gray-400');
    btn.classList.add('bg-emerald-500', 'text-white', 'active');
    renderGroups();
}

function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

async function submitGroup(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = 'Fetching DP & Submitting...';

    const link = document.getElementById('gLink').value;
    const description = document.getElementById('gDescription').value.trim();
    let imageUrl = null;

    try {
        if (link.includes('whatsapp.com')) {
            const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(link)}`);
            const data = await res.json();
            if (data && data.data && data.data.image && data.data.image.url) {
                imageUrl = data.data.image.url;
            }
        }
    } catch (err) {
        console.log("DP Fetch Error:", err);
    }

    const { error } = await db.from('groups').insert([{
        name: document.getElementById('gName').value,
        platform: document.getElementById('gPlatform').value,
        category: document.getElementById('gCategory').value,
        link: link,
        description: description || null,
        image_url: imageUrl,
        status: 'approved',
        clicks: 0,
        is_pinned: false
    }]);

    submitBtn.disabled = false;
    submitBtn.innerText = 'Submit Group';

    if (error) { 
        alert('Error: ' + error.message); 
    } else { 
        alert('Group submitted successfully!'); 
        document.getElementById('groupForm').reset();
        closeAddModal(); 
        fetchGroups(); 
    }
}

function toggleSupportChat() {
    const widget = document.getElementById('supportWidget');
    widget.classList.toggle('hidden');
    if (!widget.classList.contains('hidden')) {
        const savedName = localStorage.getItem('chatSenderName');
        if(savedName) document.getElementById('chatSenderName').value = savedName;
        loadChatMessages();
    }
}

async function loadChatMessages() {
    const box = document.getElementById('chatMessages');
    const savedName = localStorage.getItem('chatSenderName') || document.getElementById('chatSenderName').value;
    
    if(!savedName) {
        box.innerHTML = '<p class="text-center text-gray-500 text-[11px]">Type your name & message below to chat with owner.</p>';
        return;
    }

    const { data } = await db.from('messages').select('*').eq('sender_name', savedName).order('created_at', { ascending: true });
    
    if(!data || data.length === 0) {
        box.innerHTML = '<p class="text-center text-gray-500 text-[11px]">No previous messages.</p>';
        return;
    }

    box.innerHTML = data.map(m => `
        <div class="space-y-1">
            <div class="bg-slate-900 border border-slate-800 p-2 rounded-lg text-gray-200">
                <b class="text-emerald-400 text-[10px] block">${m.sender_name}</b>
                <p>${m.message}</p>
            </div>
            ${m.reply ? `
                <div class="bg-emerald-500/10 border border-emerald-500/20 p-2 rounded-lg text-emerald-300 ml-4">
                    <b class="text-emerald-400 text-[10px] block">👑 Owner Reply</b>
                    <p>${m.reply}</p>
                </div>
            ` : '<span class="text-[9px] text-gray-500 block text-right">Waiting for reply...</span>'}
        </div>
    `).join('');
    box.scrollTop = box.scrollHeight;
}

function sendUserMessage(e) {
    e.preventDefault();
    const name = document.getElementById('chatSenderName').value;
    const msg = document.getElementById('chatMsgInput').value;
    
    localStorage.setItem('chatSenderName', name);

    const btn = document.getElementById('chatSendBtn');
    btn.disabled = true;

    db.from('messages').insert([{ sender_name: name, message: msg }]).then(({ error }) => {
        if(error) {
            alert("Message error: " + error.message);
        } else {
            document.getElementById('chatMsgInput').value = '';
            loadChatMessages();
        }
        btn.disabled = false;
    });
}

// Initialize Site Settings and Groups
fetchSiteSettings();
fetchGroups();
</script>
