<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandoor Viral Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40 shadow-xl">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-emerald-500/20 p-2 rounded-xl border border-emerald-500/30">
                    <i class="fa-solid fa-share-nodes text-emerald-400 text-xl"></i>
                </div>
                <h1 class="font-bold text-base md:text-xl text-white tracking-wide">
                    Mandoor <span class="text-emerald-400">Viral Links</span>
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openAddModal()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-xs px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-plus text-xs"></i> Add Group
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 pt-5">
        <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800 mb-6 shadow-md">
            <div class="flex flex-col md:flex-row gap-3 justify-between items-center">
                <div class="relative w-full md:w-2/3">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" onkeyup="filterGroups()" placeholder="Search groups by name..." class="w-full bg-gray-950 border border-gray-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="flex items-center justify-between w-full md:w-auto gap-3">
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-2 rounded-xl">
                        Total: <b id="groupCount">0</b>
                    </span>
                </div>
            </div>

            <!-- Categories -->
            <div class="flex gap-2 overflow-x-auto mt-4 pb-1 text-xs no-scrollbar" id="categoryBar">
                <button onclick="selectCategory('All', this)" class="cat-btn active bg-emerald-500 text-white font-medium px-4 py-2 rounded-xl shrink-0">All</button>
                <button onclick="selectCategory('Gaming', this)" class="cat-btn bg-gray-950 hover:bg-gray-800 text-gray-400 px-4 py-2 rounded-xl shrink-0 border border-gray-800">Gaming</button>
                <button onclick="selectCategory('Entertainment', this)" class="cat-btn bg-gray-950 hover:bg-gray-800 text-gray-400 px-4 py-2 rounded-xl shrink-0 border border-gray-800">Entertainment</button>
                <button onclick="selectCategory('Earning', this)" class="cat-btn bg-gray-950 hover:bg-gray-800 text-gray-400 px-4 py-2 rounded-xl shrink-0 border border-gray-800">Earning</button>
                <button onclick="selectCategory('Education', this)" class="cat-btn bg-gray-950 hover:bg-gray-800 text-gray-400 px-4 py-2 rounded-xl shrink-0 border border-gray-800">Education</button>
                <button onclick="selectCategory('Others', this)" class="cat-btn bg-gray-950 hover:bg-gray-800 text-gray-400 px-4 py-2 rounded-xl shrink-0 border border-gray-800">Others</button>
            </div>
        </div>

        <!-- Group Grid -->
        <div id="listingsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-center text-xs text-gray-500 col-span-2 py-8">Loading approved groups...</p>
        </div>
    </main>

    <!-- Add Group Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-emerald-400"></i> Add New Group
                </h3>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-white text-lg font-bold">&times;</button>
            </div>
            
            <form id="groupForm" onsubmit="submitGroup(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Group Name</label>
                    <input type="text" id="gName" required placeholder="e.g. Free Fire Pakistan" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Platform</label>
                    <select id="gPlatform" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Telegram">Telegram</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Category</label>
                    <select id="gCategory" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                        <option value="Gaming">Gaming</option>
                        <option value="Gaming">Gaming</option>
<option value="Entertainment">Entertainment</option>
<option value="Earning">Earning</option>
<option value="Education">Education</option>
<option value="Voting / Matches">Voting / Matches</option>
<option value="Poetry / Shayari">Poetry / Shayari</option>
<option value="Crypto / Trading">Crypto / Trading</option>
<option value="Tech / Software">Tech / Software</option>
<option value="News / Updates">News / Updates</option>
<option value="Deals / Shopping">Deals / Shopping</option>
<option value="18+">18+</option>
<option value="Others">Others</option>
                        
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Group Link</label>
                    <input type="url" id="gLink" required placeholder="https://chat.whatsapp.com/..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl text-xs font-bold">Cancel</button>
                    <button type="submit" id="submitBtn" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-bold">Submit Group</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vnneunihydltvsyxheeg.supabase.co";
        const SUPABASE_KEY = "sb_publishable_bZMBGeoDYDLI9zTYz4yqLw_Pwfa02DY";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allApprovedGroups = [];
        let currentCategory = 'All';

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('groupForm').reset();
        }

        async function submitGroup(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Submitting...';

            const name = document.getElementById('gName').value.trim();
            const platform = document.getElementById('gPlatform').value;
            const category = document.getElementById('gCategory').value;
            const link = document.getElementById('gLink').value.trim();

            const { error } = await db.from('groups').insert([
                { name, platform, category, link, status: 'pending' }
            ]);

            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Group';

            if (error) {
                alert('Error submitting group: ' + error.message);
            } else {
                alert('Success! Your group link has been submitted and is waiting for admin approval.');
                closeAddModal();
            }
        }

        async function fetchGroups() {
            const { data, error } = await db.from('groups').select('*').eq('status', 'approved').order('created_at', { ascending: false });
            
            if (error || !data) {
                document.getElementById('listingsGrid').innerHTML = '<p class="text-center text-xs text-gray-500 col-span-2 py-8">No approved groups found.</p>';
                return;
            }

            allApprovedGroups = data;
            renderGroups();
        }

        function renderGroups() {
            const grid = document.getElementById('listingsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allApprovedGroups.filter(g => {
                const matchCategory = currentCategory === 'All' || g.category === currentCategory;
                const matchSearch = g.name.toLowerCase().includes(search);
                return matchCategory && matchSearch;
            });

            document.getElementById('groupCount').innerText = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="text-center text-xs text-gray-500 col-span-2 py-8">No approved groups found.</p>';
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800 flex justify-between items-center gap-3 shadow-md">
                    <div class="min-w-0 flex-1">
                        <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-md border border-emerald-500/20">${item.platform} • ${item.category}</span>
                        <h3 class="font-bold text-white text-sm mt-1 truncate">${item.name}</h3>
                    </div>
                    <a href="${item.link}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-xl shrink-0 shadow-md">
                        Join <i class="fa-solid fa-arrow-right text-[10px] ml-1"></i>
                    </a>
                </div>
            `).join('');
        }

        function filterGroups() {
            renderGroups();
        }

        function selectCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = 'cat-btn bg-gray-950 hover:bg-gray-800 text-gray-400 px-4 py-2 rounded-xl shrink-0 border border-gray-800';
            });
            btn.className = 'cat-btn active bg-emerald-500 text-white font-medium px-4 py-2 rounded-xl shrink-0';
            renderGroups();
        }

        fetchGroups();
    </script>
</body>
</html>
