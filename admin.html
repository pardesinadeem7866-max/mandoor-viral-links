<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandoor Links - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 font-sans">
    <div class="max-w-xl mx-auto pt-6">
        <h1 class="text-xl font-bold text-emerald-400 mb-4 text-center">Mandoor Admin Panel</h1>
        
        <!-- Login Box -->
        <div id="loginBox" class="bg-gray-900 p-6 rounded-2xl border border-gray-800 text-center space-y-4 shadow-xl">
            <p class="text-xs text-gray-300">Enter Admin Password to access:</p>
            <input type="password" id="passInput" placeholder="Password (1234)" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-center text-sm focus:outline-none focus:border-emerald-500">
            <button onclick="checkPass()" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3 rounded-xl text-xs">Login Admin</button>
        </div>

        <!-- Admin Content -->
        <div id="adminContent" class="hidden space-y-4">
            
            <!-- Visits & Joins Tracker Cards -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-center">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">👁️ Website Visits</p>
                    <p id="statVisits" class="text-lg font-extrabold text-emerald-400">0</p>
                </div>
                <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-center">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">👥 Total Group Joins</p>
                    <p id="statJoins" class="text-lg font-extrabold text-emerald-400">0</p>
                </div>
            </div>

            <!-- Links Header -->
            <div class="flex justify-between items-center border-b border-gray-800 pb-2 pt-2">
                <h3 class="text-xs font-bold text-gray-300">All Live Links</h3>
                <button onclick="loadLinks()" class="text-[10px] bg-gray-900 border border-gray-800 text-emerald-400 px-2.5 py-1 rounded-lg">🔄 Refresh</button>
            </div>

            <!-- Links List -->
            <div id="list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vnneunihydltvsyxheeg.supabase.co";
        const SUPABASE_KEY = "sb_publishable_bZMBGeoDYDLI9zTYz4yqLw_Pwfa02DY";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function checkPass() {
            const p = document.getElementById('passInput').value;
            if(p === '1234') {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadLinks();
            } else {
                alert('Wrong Password!');
            }
        }

        async function loadLinks() {
            const list = document.getElementById('list');
            list.innerHTML = '<p class="text-center text-xs text-gray-500 py-4">Loading links...</p>';

            // Fetch All Links from Supabase Database
            const { data, error } = await db.from('groups').select('*').order('created_at', { ascending: false });

            if(error || !data || data.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-gray-500 py-6">No links found.</p>`;
                document.getElementById('statJoins').innerText = "0";
                return;
            }

            // Calculate Analytics (Visits & Clicks/Joins)
            let totalJoins = 0;
            let siteVisits = localStorage.getItem('mandoor_site_visits') || 1;
            document.getElementById('statVisits').innerText = siteVisits;

            list.innerHTML = '';
            data.forEach(item => {
                const clicks = item.clicks || item.views || 0;
                totalJoins += clicks;

                list.innerHTML += `
                    <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-800 flex justify-between items-center gap-2">
                        <div class="min-w-0 flex-1">
                            <h4 class="font-bold text-white text-xs truncate">${item.name}</h4>
                            <p class="text-[10px] text-gray-400">${item.platform || 'Group'} • ${item.category || 'General'}</p>
                            
                            <div class="flex items-center gap-2 mt-1.5">
                                <a href="${item.link}" target="_blank" class="text-[10px] text-emerald-400 underline truncate block">${item.link}</a>
                                <span class="text-[10px] bg-gray-800 text-gray-300 px-2 py-0.5 rounded-md flex items-center gap-1 font-semibold">
                                    👁️ ${clicks} Joins
                                </span>
                            </div>
                        </div>

                        <div>
                            <button onclick="deleteGroup('${item.id}')" class="bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] px-3 py-1.5 rounded-lg font-bold hover:bg-red-500/30 transition">Delete</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('statJoins').innerText = totalJoins;
        }

        // Direct Delete Function
        async function deleteGroup(id) {
            if(confirm('Is link ko delete karna chahte hain?')) {
                const { error } = await db.from('groups').delete().eq('id', id);
                if(error) {
                    alert('Error deleting link: ' + error.message);
                } else {
                    loadLinks();
                }
            }
        }
    </script>
</body>
</html>
