<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mandoor Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen p-4 md:p-8">

<div class="max-w-4xl mx-auto space-y-8">

    <div class="flex justify-between items-center bg-gray-900 p-4 rounded-2xl border border-gray-800">
        <div>
            <h1 class="text-xl font-bold text-emerald-400">Admin Dashboard</h1>
            <p class="text-xs text-gray-400">Manage Groups & User Messages</p>
        </div>
        <button onclick="initAdmin()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-3.5 py-2 rounded-xl">
            <i class="fa-solid fa-rotate-right mr-1"></i> Refresh All
        </button>
    </div>

    <!-- User Messages Section -->
    <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 space-y-4">
        <h2 class="text-base font-bold text-amber-400 flex items-center gap-2">
            <i class="fa-solid fa-comments"></i> User Help Messages
        </h2>
        <div id="adminMessagesList" class="space-y-3">
            <p class="text-center text-xs text-gray-500 py-4">Loading messages...</p>
        </div>
    </div>

    <!-- Groups Section -->
    <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 space-y-4">
        <h2 class="text-base font-bold text-emerald-400 flex items-center gap-2">
            <i class="fa-solid fa-layer-group"></i> Manage Groups (VIP Pin / Delete)
        </h2>
        <div id="adminGroupList" class="space-y-3">
            <p class="text-center text-xs text-gray-500 py-4">Loading groups...</p>
        </div>
    </div>

</div>

<script>
const SUPABASE_URL = "https://vnneunihydltvsyxheeg.supabase.co";
const SUPABASE_KEY = "sb_publishable_bZMBGeoDYDLI9zTYz4yqLw_Pwfa02DY";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function initAdmin() {
    fetchMessages();
    fetchGroups();
}

async function fetchMessages() {
    const { data } = await db.from('messages').select('*').order('created_at', { ascending: false });
    const container = document.getElementById('adminMessagesList');

    if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-center text-xs text-gray-500 py-4">No messages received yet.</p>';
        return;
    }

    container.innerHTML = data.map(m => `
        <div class="bg-gray-950 p-4 rounded-xl border border-gray-800 space-y-2">
            <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-emerald-400">👤 ${m.sender_name}</span>
                <span class="text-gray-500 text-[10px]">${new Date(m.created_at).toLocaleString()}</span>
            </div>
            <p class="text-xs text-gray-200 bg-gray-900 p-2.5 rounded-lg border border-gray-800/60">${m.message}</p>
            
            ${m.reply ? `
                <div class="text-xs bg-emerald-500/10 border border-emerald-500/20 p-2 rounded-lg text-emerald-400">
                    <b>Your Reply:</b> ${m.reply}
                </div>
            ` : ''}

            <div class="flex gap-2 pt-1">
                <input type="text" id="replyInput_${m.id}" placeholder="Type reply..." class="flex-1 bg-gray-900 border border-gray-800 text-xs text-white p-2 rounded-lg focus:outline-none focus:border-emerald-500">
                <button onclick="sendReply('${m.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-3 rounded-lg">Reply</button>
                <button onclick="deleteMsg('${m.id}')" class="bg-red-500/20 text-red-400 font-bold text-xs px-2.5 rounded-lg">🗑️</button>
            </div>
        </div>
    `).join('');
}

async function sendReply(id) {
    const replyText = document.getElementById(`replyInput_${id}`).value;
    if (!replyText) return alert('Please type a reply first!');

    await db.from('messages').update({ reply: replyText }).eq('id', id);
    fetchMessages();
}

async function deleteMsg(id) {
    if(!confirm('Delete this message?')) return;
    await db.from('messages').delete().eq('id', id);
    fetchMessages();
}

async function fetchGroups() {
    const { data } = await db.from('groups').select('*').order('is_pinned', { ascending: false }).order('created_at', { ascending: false });
    const container = document.getElementById('adminGroupList');

    if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-center text-xs text-gray-500 py-4">No groups found.</p>';
        return;
    }

    container.innerHTML = data.map(item => `
        <div class="bg-gray-950 p-4 rounded-xl border ${item.is_pinned ? 'border-yellow-500/50 bg-yellow-500/5' : 'border-gray-800'} flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-md border border-emerald-500/20 font-medium">${item.platform} • ${item.category}</span>
                    ${item.is_pinned ? '<span class="text-[10px] bg-yellow-500/20 text-yellow-400 px-2 py-0.5 rounded-md border border-yellow-500/30 font-bold">📌 VIP PINNED</span>' : ''}
                </div>
                <h3 class="font-bold text-white text-sm truncate">${item.name}</h3>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="togglePin('${item.id}', ${item.is_pinned || false})" class="${item.is_pinned ? 'bg-yellow-500 text-black' : 'bg-gray-800 text-yellow-400'} font-bold text-xs px-3 py-1.5 rounded-xl">📌 ${item.is_pinned ? 'Unpin' : 'Pin'}</button>
                <button onclick="deleteGroup('${item.id}')" class="bg-red-500/20 text-red-400 font-bold text-xs px-3 py-1.5 rounded-xl">🗑️ Delete</button>
            </div>
        </div>
    `).join('');
}

async function togglePin(id, currentState) {
    await db.from('groups').update({ is_pinned: !currentState }).eq('id', id);
    fetchGroups();
}

async function deleteGroup(id) {
    if (!confirm('Delete group?')) return;
    await db.from('groups').delete().eq('id', id);
    fetchGroups();
}

initAdmin();
</script>
</body>
</html>
