<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mandoor Viral Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-gray-100 font-sans min-h-screen">

    <!-- Login Screen -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-emerald-400 mx-auto mb-2">
                    <i class="fa-solid fa-user-shield text-xl"></i>
                </div>
                <h2 class="text-lg font-bold text-white">Admin Login</h2>
                <p class="text-xs text-gray-400">Enter password to access dashboard</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div class="relative">
                    <input type="password" id="adminPassword" placeholder="Enter Password" required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-4 pr-10 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                    <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs py-3 rounded-xl transition-all shadow-lg">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Panel (Hidden by default) -->
    <div id="adminPanel" class="hidden min-h-screen pb-12">
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
            <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-emerald-400"></i> Admin Panel
                </h1>
                <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs font-bold px-3 py-1.5 rounded-xl">
                    Logout
                </button>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-4 pt-6 space-y-6">
            
            <!-- Live Overview Stats Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- Website Visitors Card -->
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center gap-4 shadow-xl">
                    <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-xl flex items-center justify-center text-xl shrink-0">
                        <i class="fa-solid fa-eye"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-medium">Total Visitors</p>
                        <h3 class="text-2xl font-bold text-white" id="totalVisitors">0</h3>
                    </div>
                </div>

                <!-- Total Groups Card -->
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center gap-4 shadow-xl">
                    <div class="w-12 h-12 bg-blue-500/10 border border-blue-500/30 text-blue-400 rounded-xl flex items-center justify-center text-xl shrink-0">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-medium">Total Groups</p>
                        <h3 class="text-2xl font-bold text-white" id="totalGroupsCount">0</h3>
                    </div>
                </div>

                <!-- Total Messages Card -->
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center gap-4 shadow-xl">
                    <div class="w-12 h-12 bg-purple-500/10 border border-purple-500/30 text-purple-400 rounded-xl flex items-center justify-center text-xl shrink-0">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-medium">User Messages</p>
                        <h3 class="text-2xl font-bold text-white" id="totalMessagesCount">0</h3>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex gap-2 border-b border-slate-800 pb-2 overflow-x-auto">
                <button onclick="switchTab('groups')" id="tabGroups" class="text-xs font-bold px-4 py-2 rounded-xl bg-emerald-500 text-white shrink-0">
                    <i class="fa-solid fa-layer-group"></i> Manage Groups
                </button>
                <button onclick="switchTab('messages')" id="tabMessages" class="text-xs font-bold px-4 py-2 rounded-xl bg-slate-900 text-gray-400 hover:text-white border border-slate-800 shrink-0">
                    <i class="fa-solid fa-comments"></i> User Messages
                </button>
                <button onclick="switchTab('settings')" id="tabSettings" class="text-xs font-bold px-4 py-2 rounded-xl bg-slate-900 text-gray-400 hover:text-white border border-slate-800 shrink-0">
                    <i class="fa-solid fa-gear"></i> Site Settings
                </button>
            </div>

            <!-- Groups Section -->
            <div id="sectionGroups" class="space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-white">All Groups</h3>
                    <button onclick="refreshDashboard()" class="text-xs text-emerald-400 hover:underline flex items-center gap-1">
                        <i class="fa-solid fa-rotate-right"></i> Refresh Stats
                    </button>
                </div>
                <div id="groupsList" class="space-y-3">
                    <p class="text-center text-xs text-gray-500 py-8">Loading groups...</p>
                </div>
            </div>

            <!-- Messages Section -->
            <div id="sectionMessages" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-white">User Support Messages</h3>
                    <button onclick="refreshDashboard()" class="text-xs text-emerald-400 hover:underline flex items-center gap-1">
                        <i class="fa-solid fa-rotate-right"></i> Refresh Stats
                    </button>
                </div>
                <div id="messagesList" class="space-y-3">
                    <p class="text-center text-xs text-gray-500 py-8">Loading messages...</p>
                </div>
            </div>

            <!-- Settings Section -->
            <div id="sectionSettings" class="hidden space-y-4">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-sliders text-emerald-400"></i> Website Control & Settings
                        </h3>
                        <button type="button" onclick="fetchSiteSettings()" class="text-xs text-emerald-400 hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-rotate-right"></i> Reload Settings
                        </button>
                    </div>
                    
                    <form onsubmit="saveSiteSettings(event)" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1 font-medium">Website Name / Title</label>
                                <input type="text" id="setting_site_title" placeholder="Mandoor Viral Links" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1 font-medium">Announcement Status</label>
                                <select id="setting_announcement_status" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
                                    <option value="1">Show Banner (ON)</option>
                                    <option value="0">Hide Banner (OFF)</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1 font-medium">Main Heading</label>
                                <input type="text" id="setting_main_heading" placeholder="Welcome to..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1 font-medium">Main Subtext</label>
                                <input type="text" id="setting_main_text" placeholder="Find the best viral links..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 block mb-1 font-medium">Announcement Banner Text</label>
                            <input type="text" id="setting_announcement_text" placeholder="Join our official groups..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1 font-medium">WhatsApp Group Link</label>
                                <input type="text" id="setting_whatsapp_group_link" placeholder="https://chat.whatsapp.com/..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1 font-medium">Telegram Group Link</label>
                                <input type="text" id="setting_telegram_group_link" placeholder="https://t.me/..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1 font-medium">About Text</label>
                                <textarea id="setting_about_text" rows="2" placeholder="About details..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1 font-medium">Contact Details / Text</label>
                                <textarea id="setting_contact_text" rows="2" placeholder="Contact info..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 block mb-1 font-medium">Footer Copyright Text</label>
                            <input type="text" id="setting_footer_text" placeholder="© 2026 Mandoor Viral Links..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
                        </div>

                        <div class="pt-2 flex items-center justify-between">
                            <button type="submit" id="saveBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-6 py-3 rounded-xl transition-all shadow-lg flex items-center gap-2">
                                <i class="fa-solid fa-floppy-disk"></i> Save All Settings
                            </button>
                            <span id="saveStatus" class="text-xs text-emerald-400 font-medium hidden">Saved successfully!</span>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

<script>
const SUPABASE_URL = "https://vnneunihydltvsyxheeg.supabase.co";
const SUPABASE_KEY = "sb_publishable_bZMBGeoDYDLI9zTYz4yqLw_Pwfa02DY";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function togglePassword() {
    const input = document.getElementById('adminPassword');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

function handleLogin(e) {
    e.preventDefault();
    const pass = document.getElementById('adminPassword').value;
    if(pass === '1234') { 
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        refreshDashboard();
    } else {
        alert('Wrong Password!');
    }
}

function logout() {
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('loginSection').classList.remove('hidden');
}

function switchTab(tab) {
    const sectionGroups = document.getElementById('sectionGroups');
    const sectionMessages = document.getElementById('sectionMessages');
    const sectionSettings = document.getElementById('sectionSettings');

    const tabGroups = document.getElementById('tabGroups');
    const tabMessages = document.getElementById('tabMessages');
    const tabSettings = document.getElementById('tabSettings');

    const activeClass = "text-xs font-bold px-4 py-2 rounded-xl bg-emerald-500 text-white shrink-0";
    const inactiveClass = "text-xs font-bold px-4 py-2 rounded-xl bg-slate-900 text-gray-400 hover:text-white border border-slate-800 shrink-0";

    sectionGroups.classList.add('hidden');
    sectionMessages.classList.add('hidden');
    sectionSettings.classList.add('hidden');

    tabGroups.className = inactiveClass;
    tabMessages.className = inactiveClass;
    tabSettings.className = inactiveClass;

    if(tab === 'groups') {
        sectionGroups.classList.remove('hidden');
        tabGroups.className = activeClass;
    } else if(tab === 'messages') {
        sectionMessages.classList.remove('hidden');
        tabMessages.className = activeClass;
    } else if(tab === 'settings') {
        sectionSettings.classList.remove('hidden');
        tabSettings.className = activeClass;
        fetchSiteSettings();
    }
}

// Refresh All Data & Visitor Stats
async function refreshDashboard() {
    fetchVisitorStats();
    fetchAdminGroups();
    fetchAdminMessages();
    fetchSiteSettings();
}

// Fetch Site Settings from Supabase
async function fetchSiteSettings() {
    try {
        const { data, error } = await db.from('site_settings').select('*');
        if (!error && data) {
            data.forEach(item => {
                const el = document.getElementById(`setting_${item.setting_key}`);
                if (el) {
                    el.value = item.setting_value || '';
                }
            });
        }
    } catch(e){}
}

// Save Site Settings to Supabase
async function saveSiteSettings(e) {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    const status = document.getElementById('saveStatus');

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

    const keys = [
        'site_title',
        'announcement_status',
        'main_heading',
        'main_text',
        'announcement_text',
        'whatsapp_group_link',
        'telegram_group_link',
        'about_text',
        'contact_text',
        'footer_text'
    ];

    try {
        const promises = keys.map(key => {
            const el = document.getElementById(`setting_${key}`);
            const val = el ? el.value : '';
            return db.from('site_settings').upsert({ setting_key: key, setting_value: val }, { onConflict: 'setting_key' });
        });

        await Promise.all(promises);

        status.classList.remove('hidden');
        setTimeout(() => status.classList.add('hidden'), 3000);
    } catch(err) {
        alert('Error saving settings');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save All Settings';
    }
}

// Live Visitor Count Fetching
async function fetchVisitorStats() {
    try {
        const { count, error } = await db.from('visitors').select('*', { count: 'exact', head: true });
        if (!error && count !== null) {
            document.getElementById('totalVisitors').innerText = count;
        }
    } catch(e){}
}

async function fetchAdminGroups() {
    const box = document.getElementById('groupsList');
    const { data, error } = await db.from('groups').select('*').order('created_at', { ascending: false });
    if(error || !data) { box.innerHTML = '<p class="text-xs text-red-400 text-center">Error loading groups</p>'; return; }
    
    document.getElementById('totalGroupsCount').innerText = data.length;

    box.innerHTML = data.map(g => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center gap-4">
            <div>
                <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded font-medium">${g.category}</span>
                <h4 class="font-bold text-white text-sm mt-1">${g.name}</h4>
                <a href="${g.link}" target="_blank" class="text-xs text-gray-400 hover:underline line-clamp-1">${g.link}</a>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="togglePin('${g.id}', ${g.is_pinned})" class="text-xs ${g.is_pinned ? 'bg-amber-500 text-black' : 'bg-slate-800 text-amber-400'} px-3 py-1.5 rounded-xl font-bold">
                    <i class="fa-solid fa-thumbtack"></i> ${g.is_pinned ? 'Pinned' : 'Pin'}
                </button>
                <button onclick="deleteGroup('${g.id}')" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 p-2 rounded-xl text-xs">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </div>
    `).join('');
}

async function togglePin(id, current) {
    await db.from('groups').update({ is_pinned: !current }).eq('id', id);
    fetchAdminGroups();
}

async function deleteGroup(id) {
    if(confirm('Are you sure you want to delete this group?')) {
        await db.from('groups').delete().eq('id', id);
        fetchAdminGroups();
    }
}

async function fetchAdminMessages() {
    const box = document.getElementById('messagesList');
    const { data } = await db.from('messages').select('*').order('created_at', { ascending: false });
    
    if(!data || data.length === 0) { 
        document.getElementById('totalMessagesCount').innerText = "0";
        box.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">No messages found.</p>'; 
        return; 
    }
    
    document.getElementById('totalMessagesCount').innerText = data.length;

    box.innerHTML = data.map(m => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-start">
                <div>
                    <b class="text-emerald-400 text-xs">${m.sender_name}</b>
                    <p class="text-white text-xs mt-1">${m.message}</p>
                </div>
                <button onclick="deleteMessage('${m.id}')" class="text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
            ${m.reply ? `<p class="text-xs text-gray-400 bg-slate-950 p-2 rounded-lg border border-slate-800"><b>Your Reply:</b> ${m.reply}</p>` : ''}
            <div class="flex gap-2">
                <input type="text" id="replyInput_${m.id}" placeholder="Type reply..." class="flex-1 bg-slate-950 border border-slate-800 text-xs text-white p-2 rounded-xl">
                <button onclick="sendAdminReply('${m.id}')" class="bg-emerald-500 text-white text-xs font-bold px-4 rounded-xl">Reply</button>
            </div>
        </div>
    `).join('');
}

async function sendAdminReply(id) {
    const text = document.getElementById(`replyInput_${id}`).value;
    if(!text) return;
    await db.from('messages').update({ reply: text }).eq('id', id);
    fetchAdminMessages();
}

async function deleteMessage(id) {
    if(confirm('Delete message?')) {
        await db.from('messages').delete().eq('id', id);
        fetchAdminMessages();
    }
}
</script>
</body>
</html>
