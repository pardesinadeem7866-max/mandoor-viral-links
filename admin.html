<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandoor Links - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 font-sans">
    <div class="max-w-xl mx-auto pt-6">
        <h1 class="text-xl font-bold text-emerald-400 mb-4 text-center">Mandoor Admin Panel</h1>
        
        <div id="loginBox" class="bg-gray-900 p-6 rounded-2xl border border-gray-800 text-center space-y-4 shadow-xl">
            <p class="text-xs text-gray-300">Enter Admin Password to access:</p>
            <input type="password" id="passInput" placeholder="Password (1234)" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-center text-sm focus:outline-none focus:border-emerald-500">
            <button onclick="checkPass()" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3 rounded-xl text-xs">Login Admin</button>
        </div>

        <div id="adminContent" class="hidden space-y-4">
            <div class="flex gap-2 border-b border-gray-800 pb-2">
                <button onclick="loadTab('pending')" id="btnPending" class="flex-1 py-2 font-bold text-xs bg-emerald-500 text-white rounded-xl">Pending Links</button>
                <button onclick="loadTab('approved')" id="btnApproved" class="flex-1 py-2 font-bold text-xs bg-gray-900 text-gray-400 rounded-xl border border-gray-800">Approved Links</button>
            </div>
            <div id="list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vnneunihydltvsyxheeg.supabase.co";
        const SUPABASE_KEY = "Sb_publishable_bZMBGeoDYDLI9zTYz4yqLw_Pwfa02DY";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentTab = 'pending';

        function checkPass() {
            const p = document.getElementById('passInput').value;
            if(p === '1234') {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadTab('pending');
            } else {
                alert('Wrong Password!');
            }
        }

        async function loadTab(type) {
            currentTab = type;
            document.getElementById('btnPending').className = type === 'pending' ? 'flex-1 py-2 font-bold text-xs bg-emerald-500 text-white rounded-xl' : 'flex-1 py-2 font-bold text-xs bg-gray-900 text-gray-400 rounded-xl border border-gray-800';
            document.getElementById('btnApproved').className = type === 'approved' ? 'flex-1 py-2 font-bold text-xs bg-emerald-500 text-white rounded-xl' : 'flex-1 py-2 font-bold text-xs bg-gray-900 text-gray-400 rounded-xl border border-gray-800';

            const list = document.getElementById('list');
            list.innerHTML = '<p class="text-center text-xs text-gray-500 py-4">Loading links...</p>';

            const { data } = await db.from('groups').select('*').eq('status', type).order('created_at', { ascending: false });

            if(!data || data.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-gray-500 py-6">No ${type} groups found.</p>`;
                return;
            }

            list.innerHTML = '';
            data.forEach(item => {
                list.innerHTML += `
                    <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-800 flex justify-between items-center gap-2">
                        <div class="min-w-0 flex-1">
                            <h4 class="font-bold text-white text-xs truncate">${item.name}</h4>
                            <p class="text-[10px] text-gray-400">${item.platform} • ${item.category}</p>
                            <a href="${item.link}" target="_blank" class="text-[10px] text-emerald-400 underline truncate block">${item.link}</a>
                        </div>
                        <div class="flex gap-1.5">
                            ${type === 'pending' ? `<button onclick="updateStatus('${item.id}', 'approved')" class="bg-emerald-500 text-white text-[10px] px-3 py-1.5 rounded-lg font-bold">Approve</button>` : ''}
                            <button onclick="deleteGroup('${item.id}')" class="bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] px-3 py-1.5 rounded-lg font-bold">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        async function updateStatus(id, newStatus) {
            await db.from('groups').update({ status: newStatus }).eq('id', id);
            loadTab('pending');
        }

        async function deleteGroup(id) {
            if(confirm('Delete this group?')) {
                await db.from('groups').delete().eq('id', id);
                loadTab(currentTab);
            }
        }
    </script>
</body>
</html>
